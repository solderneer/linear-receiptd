[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-receiptd"
version = "0.1.0"
description = "Print newly assigned Linear issues on an InstaPrint/CorePrint BLE receipt printer"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["licenses/**/*", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "aiohttp>=3.10,<4", "Pillow>=11,<14", "qrcode>=8.2,<9",
  "markdown-it-py>=4,<5", "bleak>=3.0.2,<4", "crc8>=0.2.1,<1",
  "platformdirs>=4,<5", "packaging>=24,<27", "pyserial>=3.5,<4",
  "pypdfium2>=4,<6",
  "pyobjc-framework-IOBluetooth>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8,<10"]

[project.scripts]
linear-receiptd = "linear_receiptd.__main__:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linear_receiptd = ["assets/*.json", "assets/fonts/*"]
timiniprint = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
